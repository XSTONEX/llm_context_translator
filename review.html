<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生词本复习</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="paper.css">
  <style>
    /* 纸页：一张印出来的单词卡；明净的样式在 clear.css */
    body {
      min-height: 100vh;
    }

    .review {
      width: min(760px, 100% - 48px);
      margin: 0 auto;
      padding: 56px 0 48px;
    }

    .review-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    /* 纸页标题在上、小型大写的副题在下；明净反过来 */
    .review-titles {
      display: flex;
      flex-direction: column-reverse;
    }

    .review-title {
      margin: 0;
      font-family: var(--display-zh);
      font-weight: 400;
      font-size: 40px;
      line-height: 1.05;
      letter-spacing: 0.06em;
    }

    .review-eyebrow {
      margin-top: 6px;
      font-family: var(--smallcaps);
      font-variant-caps: small-caps;
      font-size: 15px;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .review-progress {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .progress-text {
      font-family: var(--body);
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 180px;
      height: 1.5px;
      overflow: hidden;
      background: var(--rule-soft);
    }

    .progress-fill {
      width: 0;
      min-width: 6px;
      height: 100%;
      background: var(--ink);
      transition: width 0.2s;
    }

    .review .double-rule {
      margin-top: 16px;
    }

    .stage {
      margin-top: 36px;
    }

    .card {
      min-height: 300px;
      display: flex;
      flex-direction: column;
      padding: 34px 44px 38px;
      border: 1.5px solid var(--ink);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04),
                  1px 2px 3px -1px rgba(27, 22, 17, 0.22),
                  6px 14px 28px -10px rgba(27, 22, 17, 0.38);
      cursor: pointer;
    }

    :root[data-theme="dark"] .card {
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2),
                  1px 2px 3px -1px rgba(0, 0, 0, 0.4),
                  6px 14px 28px -10px rgba(0, 0, 0, 0.6);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-lang {
      font-family: var(--smallcaps);
      font-variant-caps: small-caps;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }

    .card .ring {
      width: 40px;
      height: 40px;
    }

    .card .ring.is-loading {
      animation: paper-pulse 1s ease-in-out infinite;
      cursor: wait;
    }

    .card .ring.is-error {
      opacity: 0.5;
    }

    .card-wordline {
      margin-top: 4px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      column-gap: 16px;
    }

    .card-word {
      font-family: var(--body);
      font-size: 48px;
      font-weight: 500;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .card-reading {
      font-family: var(--body);
      font-size: 19px;
      font-style: italic;
      /* 假名没有真斜体，别让浏览器硬拉斜 */
      font-synthesis: none;
      color: var(--ink-muted);
    }

    .card-core {
      margin-top: 18px;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.06em;
    }

    .card-defs {
      margin-top: 22px;
      border-top: 1px solid var(--rule-soft);
    }

    .card-def {
      display: flex;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--rule-soft);
    }

    .card-def .pos {
      flex: none;
      font-family: var(--smallcaps);
      font-variant-caps: small-caps;
      font-size: 17px;
      color: var(--ink-muted);
    }

    .card-def .leader {
      align-self: auto;
      transform: translateY(-5px);
    }

    .def-meaning {
      font-size: 17px;
      line-height: 1.6;
    }

    .card-hint {
      margin-top: auto;
      padding-top: 28px;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .controls {
      margin-top: 30px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .controls .spacer {
      flex: 1;
    }

    .btn {
      appearance: none;
      margin: 0;
      padding: 8px 18px;
      border: 1.5px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      letter-spacing: 0.14em;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) {
      background: var(--tint);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* 翻面：印章按钮 */
    .btn-primary {
      margin: 0 4px 4px 0;
      padding: 8px 26px;
      box-shadow: 4px 4px 0 var(--ink);
      font-weight: 600;
      letter-spacing: 0.18em;
      transition: transform 0.12s, box-shadow 0.12s;
    }

    .btn-primary:hover:not(:disabled) {
      background: transparent;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    /* 随机重排、移出生词本：文字按钮；纸页不用红色 */
    .btn-quiet {
      padding: 0;
      border: 0;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .btn-quiet:hover:not(:disabled) {
      background: transparent;
      color: var(--accent);
    }

    .btn-quiet + .btn-quiet {
      margin-left: 6px;
    }

    .btn-danger {
      color: var(--ink-muted);
    }

    .kbd-hint {
      margin: 22px 0 0;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .kbd {
      display: inline-block;
      min-width: 22px;
      padding: 0 5px;
      border: 1px solid var(--ink);
      font-family: var(--body);
      font-size: 12px;
      line-height: 18px;
      text-align: center;
      color: var(--ink);
    }

    .empty {
      margin: 0;
      font-size: 15px;
      line-height: 1.9;
      color: var(--ink-muted);
    }
  </style>
  <link rel="stylesheet" href="clear.css">
</head>
<body>
  <div class="review">
    <header class="review-head">
      <div class="review-titles">
        <div class="review-eyebrow">vocabulary review</div>
        <h1 class="review-title">生词本复习</h1>
      </div>
      <div class="review-progress" id="progressBox" hidden>
        <span class="progress-text" id="progress"></span>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </header>
    <div class="double-rule"></div>

    <div class="stage" id="stage"></div>
  </div>

  <script src="config.js"></script>
  <script src="favorites-api.js"></script>
  <script src="review.js"></script>
</body>
</html>
