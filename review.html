<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生词本复习</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --faint: #9ca3af;
      --border: #e5e7eb;
      --accent: #007AFF;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                   'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .topbar {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
    }

    .topbar h1 { font-size: 18px; font-weight: 700; }

    .progress { font-size: 13px; color: var(--muted); }

    .stage {
      flex: 1;
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px 24px;
      gap: 20px;
    }

    .card {
      width: 100%;
      min-height: 320px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      padding: 40px 36px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      transition: box-shadow 0.2s ease;
    }

    .card:hover { box-shadow: 0 10px 36px rgba(0, 0, 0, 0.1); }

    .card-lang {
      font-size: 12px;
      color: var(--faint);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .card-front-word {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
    }

    .card-hint { font-size: 13px; color: var(--faint); margin-top: 8px; }

    .card-back { width: 100%; display: flex; flex-direction: column; gap: 14px; }

    .back-reading { font-size: 16px; color: var(--muted); }

    .back-core {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.4;
      word-break: break-word;
    }

    .back-defs {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
      width: 100%;
      max-width: 460px;
      margin: 4px auto 0;
    }

    .back-def {
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
      padding-left: 8px;
      border-left: 2px solid var(--border);
    }

    .back-def .pos { color: var(--accent); font-weight: 600; margin-right: 6px; }

    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }

    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { color: #fff; opacity: 0.92; }
    .btn-danger:hover { border-color: #ff3b30; color: #ff3b30; }

    .kbd-hint { font-size: 12px; color: var(--faint); margin-top: 4px; }
    .kbd { font-family: 'SF Mono', monospace; background: #eceef1; border-radius: 4px; padding: 1px 6px; }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>生词本复习</h1>
    <span class="progress" id="progress"></span>
  </div>

  <div class="stage" id="stage"></div>

  <script src="config.js"></script>
  <script src="favorites-api.js"></script>
  <script src="review.js"></script>
</body>
</html>
