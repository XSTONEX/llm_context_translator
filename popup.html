<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>划词翻译</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="paper.css">
  <style>
    body {
      width: 340px;
    }

    .popup {
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
    }

    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .popup-title {
      font-family: var(--display-zh);
      font-size: 28px;
      line-height: 1.05;
      letter-spacing: 0.06em;
    }

    .popup-status {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }

    .popup-actions {
      display: flex;
      gap: 8px;
    }

    .popup .double-rule {
      margin-top: 14px;
    }

    .popup-row {
      display: flex;
      align-items: center;
      padding: 14px 0 12px;
    }

    .popup-row + .popup-row {
      padding-top: 12px;
      border-top: 1px solid var(--rule-soft);
    }

    .popup-label {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.16em;
      white-space: nowrap;
    }

    .popup-hint {
      margin-top: 2px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
    }

    .popup .leader {
      margin: 0 10px;
    }

    .popup .seg button {
      padding: 4px 10px;
    }
  </style>
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div>
        <div class="popup-title">划词翻译</div>
        <div class="popup-status"><span class="status-dot" id="statusDot"></span><span id="statusText">检查中</span></div>
      </div>
      <div class="popup-actions">
        <button type="button" class="ring" id="reviewButton" aria-label="复习生词" title="复习生词">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>
        </button>
        <button type="button" class="ring" id="settingsButton" aria-label="打开设置" title="设置">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <div class="double-rule"></div>

    <div class="popup-row">
      <div>
        <div class="popup-label">总开关</div>
        <div class="popup-hint"><span id="shortcutKey">⌘⇧L</span> 随时暂停所有网站</div>
      </div>
      <span class="leader"></span>
      <div class="seg" role="group" aria-label="总开关" id="enableSeg">
        <button type="button" data-value="on">开</button>
        <button type="button" data-value="off">关</button>
      </div>
    </div>

    <div class="popup-row">
      <div class="popup-label">外观</div>
      <span class="leader"></span>
      <div class="seg" role="group" aria-label="外观" id="themeSeg">
        <button type="button" data-value="system">跟随系统</button>
        <button type="button" data-value="light">浅色</button>
        <button type="button" data-value="dark">深色</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="favorites-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
